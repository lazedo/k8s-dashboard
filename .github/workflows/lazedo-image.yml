# lazedo fork: build the plugin-capable dashboard and publish it to GHCR.
#
# This is the PRE-SPLIT dashboard — the tree from before upstream removed the
# plugin system — carried on the pre-split-plugins branch along with the Angular
# migration. Dockerfile.kind builds it single-locale (en), which is what makes a
# full frontend build finish in CI time while producing the same scratch image
# layout as upstream's aio/Dockerfile.
#
# Published as k8s-dashboard — the name aio/deploy/kz-eu and kz-capd reference.
# "k8s-dashboard-plugins" is only a LOCAL image name, produced by build-kind.sh
# for kind load; it never had a registry prefix.
#
# Separate from upstream's cd-workflow.yml, which publishes the split (plugin-
# less) dashboard under its own names and release process.
#
# Each arch builds on a NATIVE runner and the two are joined by digest into one
# manifest — no QEMU, which for a Node/Angular build would be punishing. Images
# carry the short commit SHA; a release additionally carries its tag.
name: image

on:
  push:
    branches:
      - pre-split-plugins
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: lazedo-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: k8s-dashboard

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.kind
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=dashboard-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=dashboard-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/dashboard-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-dashboard-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: digest-dashboard-*
          path: /tmp/digests
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Create multi-arch manifest
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${{ github.repository_owner }}/${IMAGE_NAME}"
          TAGS="-t ${IMAGE}:${{ steps.sha.outputs.short }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="${TAGS} -t ${IMAGE}:${{ github.ref_name }} -t ${IMAGE}:latest"
          elif [ "${{ github.ref_name }}" = "pre-split-plugins" ]; then
            TAGS="${TAGS} -t ${IMAGE}:latest"
          fi
          # shellcheck disable=SC2046
          docker buildx imagetools create ${TAGS} \
            $(for f in /tmp/digests/*; do echo "${IMAGE}@$(cat "$f")"; done)
          docker buildx imagetools inspect "${IMAGE}:${{ steps.sha.outputs.short }}"
          echo "\`${IMAGE}:${{ steps.sha.outputs.short }}\` (amd64+arm64)" >> "$GITHUB_STEP_SUMMARY"

  # Publish the install manifests as an OCI artifact pinned to THIS commit's
  # image — the pin is generated here, never by hand, so image and manifest
  # cannot drift. Recovery is workflow_dispatch on a ref: it regenerates image
  # AND manifest for that same sha — never a "latest image" lookup, which
  # would couple a manifest at commit X with an image from commit Y.
  manifests:
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: fluxcd/flux2/action@v2.9.2

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Assemble manifests pinned to this commit
        run: |
          set -euo pipefail
          SHORT="${{ steps.sha.outputs.short }}"
          mkdir -p /tmp/manifests
          cp -R aio/deploy/. /tmp/manifests/
          grep -rl "newName: ghcr.io/lazedo/k8s-dashboard" /tmp/manifests --include=kustomization.yaml \\
            | xargs sed -i -E "s/newTag: .*/newTag: ${SHORT}/"
          grep -rq "newTag: ${SHORT}" /tmp/manifests

      - name: Push OCI artifact
        run: |
          set -euo pipefail
          flux push artifact "oci://ghcr.io/lazedo/manifests/k8s-dashboard:${{ steps.sha.outputs.short }}" \
            --path /tmp/manifests \
            --source "${{ github.server_url }}/${{ github.repository }}" \
            --revision "${{ github.ref_name }}@sha1:${{ github.sha }}" \
            --creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}"
          if [ "${{ github.ref_name }}" = "pre-split-plugins" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            flux tag artifact "oci://ghcr.io/lazedo/manifests/k8s-dashboard:${{ steps.sha.outputs.short }}" \
              --tag latest --creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}"
          fi
