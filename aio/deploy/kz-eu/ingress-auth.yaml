# The kz-eu auth stack lives in every workload cluster: auth_request goes to
# the LOCAL oauth2-proxy (no cross-region hop, sessions shared via the redis
# ring), sign-in bounces through the shared RR host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubernetes-dashboard
  annotations:
    cert-manager.io/cluster-issuer: k8s-2600hz-dev
    # URL externo: nos clusters kz-eu o dominio é <zona>.cluster.local, logo
    # svc.cluster.local não resolve (500 no auth_request). authz fino =
    # RBAC do user via kube-oidc-proxy (o proxy admin foi removido).
    nginx.ingress.kubernetes.io/auth-url: https://auth.kz-eu.k8s.2600hz.dev/oauth2/auth
    nginx.ingress.kubernetes.io/auth-signin: >-
      https://auth.kz-eu.k8s.2600hz.dev/oauth2/start?rd=https://$host$request_uri$is_args$args
