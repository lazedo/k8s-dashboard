apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-dashboard
spec:
  template:
    spec:
      imagePullSecrets:
      - name: lazedo-ghcr
      containers:
      - name: kubernetes-dashboard
        imagePullPolicy: Always
        env:
        - name: SSL_CERT_FILE
          value: /certs/bundle.crt
        volumeMounts:
        - name: ca-bundle
          mountPath: /certs
        args:
        - --namespace=dashboard-plugins
        - --insecure-bind-address=0.0.0.0
        - --insecure-port=9090
        - --enable-insecure-login
        - --apiserver-host=https://kube-oidc-proxy.auth.svc:6443
      initContainers:
      - name: ca-bundle
        image: alpine:3.20
        command:
        - sh
        - -c
        - apk add -q ca-certificates && cat /etc/ssl/certs/ca-certificates.crt /oidc-ca/ca.crt
          > /bundle/bundle.crt
        volumeMounts:
        - name: oidc-ca
          mountPath: /oidc-ca
        - name: ca-bundle
          mountPath: /bundle
      volumes:
      - name: oidc-ca
        secret:
          secretName: kube-oidc-proxy-ca
          items:
          - key: ca.crt
            path: ca.crt
      - name: ca-bundle
        emptyDir: {}
