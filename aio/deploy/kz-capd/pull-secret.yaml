# lab patch: ghcr pull secret + args aligned with the transformed namespace
# (the kind base says --namespace=dashboard-plugins; this overlay moves
# everything to ns dashboard, so the app must look for its secrets there).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-dashboard
spec:
  template:
    spec:
      imagePullSecrets:
        - name: lazedo-ghcr
      containers:
        - name: kubernetes-dashboard
          args:
            - --namespace=dashboard
            - --insecure-bind-address=0.0.0.0
            - --insecure-port=9090
            - --enable-insecure-login
            - --enable-skip-login
