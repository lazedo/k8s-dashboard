# Cluster-scoped GlobalPlugin: the proper model for a "global" plugin. It shares
# the dashboard.k8s.io/v1alpha1 group with the namespaced Plugin but, being
# cluster-scoped, carries no namespace (so its sidebar pin shows no "N") and needs
# no namespace to hold its source — hence inline source is the natural fit.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: globalplugins.dashboard.k8s.io
  annotations:
    api-approved.kubernetes.io: "unapproved, experimental-only"
spec:
  group: dashboard.k8s.io
  scope: Cluster
  names:
    kind: GlobalPlugin
    plural: globalplugins
    singular: globalplugin
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [source]
              properties:
                source:
                  type: object
                  # Cluster-scoped plugins cannot reference a namespaced ConfigMap,
                  # so the source must be inline.
                  required: [inline]
                  properties:
                    inline:
                      type: object
                      required: [js]
                      properties:
                        js: { type: string }
                        encoding:
                          type: string
                          enum: ["", "gzip+base64"]
                dependencies:
                  type: array
                  items: { type: string }
                description: { type: string }
                icon: { type: string }
                # Plugins with their own nav section opt out of the pinned
                # entries under the Plugins group.
                navHidden: { type: boolean }
                # Per-plugin proxy allow-list: the dashboard forwards GETs on
                # /api/v1/globalplugin/{name}/proxy/{route.name}/... to the
                # declared url, so browser-side plugin code can reach
                # CORS-restricted upstreams (e.g. artifacthub.io).
                proxy:
                  type: array
                  items:
                    type: object
                    required: [name, url]
                    properties:
                      name: { type: string }
                      url: { type: string }
                      # Free-form labels; catalog routes (cat:*) are filterable
                      # by them in the Apps plugin.
                      tags:
                        type: array
                        items: { type: string }
