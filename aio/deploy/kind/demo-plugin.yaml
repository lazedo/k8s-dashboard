apiVersion: dashboard.k8s.io/v1alpha1
kind: Plugin
metadata:
  name: demo-plugin
  namespace: dashboard-plugins
spec:
  global: true
  description: "Lists the Kazoo clusters via the extended CRD API — a demo of the restored plugin system (global, pinnable)."
