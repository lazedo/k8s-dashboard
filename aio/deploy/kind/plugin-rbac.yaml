# Extra RBAC so the dashboard can discover plugins (dashboard.k8s.io/plugins) and
# read the ConfigMaps that hold each plugin's compiled JS source.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubernetes-dashboard-plugins
rules:
  - apiGroups: ["dashboard.k8s.io"]
    resources: ["plugins", "globalplugins", "formplugins"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernetes-dashboard-plugins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubernetes-dashboard-plugins
subjects:
  - kind: ServiceAccount
    name: kubernetes-dashboard
    namespace: kubernetes-dashboard
