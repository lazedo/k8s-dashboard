# Plugin CRD migrated from the original apiextensions.k8s.io/v1beta1 (removed in
# k8s 1.22) to v1, so it applies on a current kind cluster.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: plugins.dashboard.k8s.io
  annotations:
    api-approved.kubernetes.io: "unapproved, experimental-only"
spec:
  group: dashboard.k8s.io
  scope: Namespaced
  names:
    kind: Plugin
    plural: plugins
    singular: plugin
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [source]
              properties:
                source:
                  type: object
                  # Exactly one of configMapRef or inline supplies the plugin JS.
                  oneOf:
                    - required: [configMapRef]
                    - required: [inline]
                  properties:
                    configMapRef:
                      type: object
                      required: [name]
                      properties:
                        name: { type: string }
                    filename: { type: string }
                    # inline embeds the compiled JS directly in the CR (no ConfigMap,
                    # so no namespace needed to hold it). encoding "gzip+base64"
                    # carries a base64 string of gzip-compressed JS.
                    inline:
                      type: object
                      required: [js]
                      properties:
                        js: { type: string }
                        encoding:
                          type: string
                          enum: ["", "gzip+base64"]
                dependencies:
                  type: array
                  items: { type: string }
                # description: long text shown in the Plugins list.
                description: { type: string }
                # icon: image URL or data-URI shown next to the plugin in the list.
                icon: { type: string }
                # Per-plugin proxy allow-list (schema parity with GlobalPlugin;
                # the backend route currently serves global plugins).
                proxy:
                  type: array
                  items:
                    type: object
                    required: [name, url]
                    properties:
                      name: { type: string }
                      url: { type: string }
                      # Free-form labels; catalog routes (cat:*) are filterable
                      # by them in the Apps plugin.
                      tags:
                        type: array
                        items: { type: string }
