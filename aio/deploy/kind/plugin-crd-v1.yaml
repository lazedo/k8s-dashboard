# Plugin CRD migrated from the original apiextensions.k8s.io/v1beta1 (removed in
# k8s 1.22) to v1, so it applies on a current kind cluster.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: plugins.dashboard.k8s.io
  annotations:
    api-approved.kubernetes.io: "unapproved, experimental-only"
spec:
  group: dashboard.k8s.io
  scope: Namespaced
  names:
    kind: Plugin
    plural: plugins
    singular: plugin
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [source]
              properties:
                source:
                  type: object
                  required: [configMapRef, filename]
                  properties:
                    configMapRef:
                      type: object
                      required: [name]
                      properties:
                        name: { type: string }
                    filename: { type: string }
                dependencies:
                  type: array
                  items: { type: string }
                # global: when true the plugin is available in every namespace (and
                # always listed); otherwise only in its own namespace.
                global: { type: boolean }
                # description: long text shown in the Plugins list.
                description: { type: string }
                # icon: image URL or data-URI shown next to the plugin in the list.
                icon: { type: string }
