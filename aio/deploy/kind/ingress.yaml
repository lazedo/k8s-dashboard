# Service-level access + Ingress for the dashboard on kind (dash.west...).
# The dashboard container serves HTTP on 9090 (--insecure-bind-address); the
# bundled Service is :443→8443 (https), so we add a plain HTTP Service on 9090
# and route the ingress to it.
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-dashboard-http
  namespace: dashboard-plugins
  labels: { k8s-app: kubernetes-dashboard }
spec:
  selector: { k8s-app: kubernetes-dashboard }
  ports:
    - port: 9090
      targetPort: 9090
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubernetes-dashboard
  namespace: dashboard-plugins
  annotations:
    cert-manager.io/cluster-issuer: smartpbx-dns-issuer
    nginx.ingress.kubernetes.io/auth-url: https://auth.m2.lazedo.k8s.2600hz.dev/oauth2/auth
    nginx.ingress.kubernetes.io/auth-signin: >-
      https://auth.m2.lazedo.k8s.2600hz.dev/oauth2/start?rd=https://$host$request_uri$is_args$args
    nginx.ingress.kubernetes.io/auth-response-headers: Authorization
    nginx.ingress.kubernetes.io/configuration-snippet: |
      auth_request_set $token $upstream_http_authorization;
      auth_request_set $name_upstream_1 $upstream_cookie__oauth2_proxy_1;
      access_by_lua_block {
        if ngx.var.name_upstream_1 ~= "" then
          ngx.header["Set-Cookie"] = "_oauth2_proxy_1=" .. ngx.var.name_upstream_1 .. ngx.var.auth_cookie:match("(; .*)")
        end
      }
spec:
  ingressClassName: nginx
  tls:
    - hosts: [dash.west.m2.lazedo.k8s.2600hz.dev]
      secretName: dashboard-tls
  rules:
    - host: dash.west.m2.lazedo.k8s.2600hz.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: kubernetes-dashboard-http, port: { number: 9090 } } }
