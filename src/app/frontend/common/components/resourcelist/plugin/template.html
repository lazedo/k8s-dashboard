<kd-card role="table"
         [hidden]="isHidden()">
  <div title
       i18n>Plugins</div>
  <div description><span class="kd-muted-light"
                        i18n>Items:&nbsp;</span>{{ totalItems }}</div>
  <div actions>
    <kd-card-list-filter></kd-card-list-filter>
  </div>

  <div content
       [hidden]="showZeroState()">
    <div kdLoadingSpinner
         [isLoading]="isLoading"></div>

    <!-- ResourceListBase requires a matSort + mat-paginator (static ViewChild); the
         card grid doesn't use a table, so keep them present but inert/hidden. -->
    <div matSort
         matSortActive="created"
         matSortDisableClear
         matSortDirection="asc"
         style="display: none"></div>

    <div class="kd-plugin-grid">
      <div *ngFor="let plugin of (pagedPlugins$ | async)"
           class="kd-plugin-card">
        <a class="kd-plugin-card-link"
           [routerLink]="detailsHref(plugin)"
           queryParamsHandling="preserve">
          <div class="kd-plugin-card-icon">
            <img *ngIf="icon(plugin)"
                 [src]="icon(plugin)"
                 alt="" />
            <mat-icon *ngIf="!icon(plugin)">extension</mat-icon>
          </div>
          <div class="kd-plugin-card-body">
            <div class="kd-plugin-card-title">
              <span>{{ plugin.objectMeta.name }}</span>
              <span *ngIf="plugin.global"
                    class="kd-plugin-badge kd-plugin-badge-global"
                    i18n>global</span>
              <span *ngIf="!plugin.global"
                    class="kd-plugin-badge"
                    title="namespace">{{ plugin.objectMeta.namespace }}</span>
            </div>
            <div class="kd-plugin-card-desc">{{ plugin.description || ('No description provided.') }}</div>
          </div>
        </a>
        <button mat-icon-button
                class="kd-plugin-card-pin"
                [class.is-pinned]="isPinned(plugin)"
                [attr.aria-label]="isPinned(plugin) ? 'Unpin' : 'Pin'"
                [title]="isPinned(plugin) ? 'Unpin from sidebar' : 'Pin to sidebar'"
                (click)="togglePin(plugin, $event)">
          <mat-icon svgIcon="pin"></mat-icon>
        </button>
      </div>
    </div>

    <mat-paginator [length]="totalItems"
                   [pageSize]="itemsPerPage"
                   hidePageSize
                   [hidden]="totalItems <= itemsPerPage"></mat-paginator>
  </div>

  <div content
       [hidden]="!showZeroState()">
    <kd-list-zero-state></kd-list-zero-state>
  </div>
</kd-card>
