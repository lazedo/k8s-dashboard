<mat-form-field class="kd-cluster-select-container">
  <mat-select panelClass="kd-cluster-select-panel"
              panelWidth="auto"
              class="kd-cluster-select"
              i18n-aria-label
              aria-label="Cluster"
              [value]="selectedCluster"
              (selectionChange)="onClusterChange($event.value)">
    <mat-option *ngFor="let cluster of clusters"
                [value]="cluster.name"
                [disabled]="!cluster.accessible">
      {{ cluster.name }}
      <span *ngIf="isLocal(cluster)"
            class="kd-cluster-option-local"
            i18n>local</span>
    </mat-option>
  </mat-select>
</mat-form-field>
