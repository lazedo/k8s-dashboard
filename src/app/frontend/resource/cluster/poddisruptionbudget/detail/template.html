<kd-object-meta [initialized]="isInitialized"
                [objectMeta]="pdb?.objectMeta"></kd-object-meta>

<kd-card [initialized]="isInitialized">
  <div title
       i18n>Status</div>
  <div content
       *ngIf="isInitialized"
       fxLayout="row wrap">
    <kd-property>
      <div key
           i18n>Budget</div>
      <div value>{{ budget() }}</div>
    </kd-property>
    <kd-property>
      <div key
           i18n>Allowed disruptions</div>
      <div value>{{ pdb?.disruptionsAllowed }}</div>
    </kd-property>
    <kd-property>
      <div key
           i18n>Current healthy</div>
      <div value>{{ pdb?.currentHealthy }}</div>
    </kd-property>
    <kd-property>
      <div key
           i18n>Desired healthy</div>
      <div value>{{ pdb?.desiredHealthy }}</div>
    </kd-property>
    <kd-property>
      <div key
           i18n>Expected pods</div>
      <div value>{{ pdb?.expectedPods }}</div>
    </kd-property>
    <kd-property *ngIf="pdb?.unhealthyPodEvictionPolicy">
      <div key
           i18n>Unhealthy pod eviction policy</div>
      <div value>{{ pdb?.unhealthyPodEvictionPolicy }}</div>
    </kd-property>
    <kd-property *ngIf="pdb?.selector?.matchLabels">
      <div key
           i18n>Selector</div>
      <div value>
        <kd-chips [map]="pdb?.selector?.matchLabels"></kd-chips>
      </div>
    </kd-property>
  </div>
</kd-card>

<kd-condition-list *ngIf="pdb?.conditions?.length"
                   [conditions]="pdb?.conditions"
                   [initialized]="isInitialized"></kd-condition-list>
