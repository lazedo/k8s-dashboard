<kd-object-meta [initialized]="isInitialized"
                [objectMeta]="nodePool?.objectMeta"></kd-object-meta>

<kd-card [initialized]="isInitialized">
  <div title
       i18n>Autoscaling rules</div>
  <div content
       *ngIf="isInitialized"
       fxLayout="row wrap">
    <kd-property *ngIf="nodePool?.limits">
      <div key
           i18n>Limits</div>
      <div value>
        <kd-chips [map]="nodePool?.limits"
                  [displayAll]="true"></kd-chips>
      </div>
    </kd-property>

    <kd-property *ngIf="nodePool?.consolidationPolicy">
      <div key
           i18n>Consolidation Policy</div>
      <div value>{{ nodePool?.consolidationPolicy }}</div>
    </kd-property>

    <kd-property *ngIf="nodePool?.consolidateAfter">
      <div key
           i18n>Consolidate After</div>
      <div value>{{ nodePool?.consolidateAfter }}</div>
    </kd-property>

    <kd-property *ngIf="nodePool?.weight !== undefined">
      <div key
           i18n>Weight</div>
      <div value>{{ nodePool?.weight }}</div>
    </kd-property>
  </div>
</kd-card>
