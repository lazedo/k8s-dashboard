<div *ngIf="!active"
     class="kd-form-cards">
  <div class="kd-form-card kd-clickable"
       *ngFor="let card of cards"
       (click)="open(card)">
    <mat-icon class="kd-form-card-icon">{{ card.icon }}</mat-icon>
    <div class="kd-form-card-body">
      <div class="kd-form-card-title">{{ card.title }}</div>
      <div class="kd-form-card-description kd-muted">{{ card.description }}</div>
    </div>
  </div>
</div>

<div *ngIf="active">
  <button type="button"
          class="kd-form-cards-back"
          (click)="back()"
          color="primary"
          mat-button>
    <mat-icon>arrow_back</mat-icon>
    <span i18n>All forms</span>
  </button>
  <span class="kd-form-cards-active kd-muted">{{ active.title }}</span>

  <kd-create-from-form *ngIf="active.id === 'deployment'"></kd-create-from-form>
  <kd-form-plugin-host *ngIf="active.script"
                       [script]="active.script"
                       [args]="active.args"
                       (closed)="back()"></kd-form-plugin-host>

  <!-- Action bar: owned by the container, fed by the active form (contract.ts). -->
  <div class="kd-form-action-bar"
       *ngIf="barButtons.length">
    <ng-container *ngFor="let b of barButtons">
      <button *ngIf="b.raised"
              mat-raised-button
              color="primary"
              type="button"
              [disabled]="b.disabled"
              (click)="onBarClick(b.id)">{{ b.label }}</button>
      <button *ngIf="!b.raised"
              mat-button
              color="primary"
              type="button"
              [disabled]="b.disabled"
              (click)="onBarClick(b.id)">{{ b.label }}</button>
    </ng-container>
  </div>
</div>
