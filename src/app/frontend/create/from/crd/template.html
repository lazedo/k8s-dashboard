<div class="kd-create-from-input-info">
  <span i18n>
    Pick a Custom Resource Definition; a YAML skeleton for it is generated below —
    complete the spec and create.
  </span>
</div>

<form>
  <mat-form-field class="kd-block">
    <mat-label i18n>Custom Resource Definition</mat-label>
    <input matInput
           name="crdFilter"
           type="text"
           [(ngModel)]="filterQuery"
           [matAutocomplete]="crdAuto"
           placeholder="Type to filter CRDs..." />
    <mat-autocomplete #crdAuto="matAutocomplete"
                      (optionSelected)="select($event.option.value)">
      <mat-option *ngFor="let crd of filteredCrds()"
                  [value]="crd.objectMeta.name">
        {{ crd.objectMeta.name }}
      </mat-option>
    </mat-autocomplete>
  </mat-form-field>
</form>

<div *ngIf="selected">
  <kd-text-input [(text)]="inputData"></kd-text-input>

  <button type="button"
          (click)="create()"
          [disabled]="isCreateDisabled()"
          color="primary"
          mat-raised-button
          i18n>Create
  </button>

  <button type="button"
          (click)="cancel()"
          color="primary"
          mat-button
          i18n>Cancel</button>
</div>
